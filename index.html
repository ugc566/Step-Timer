<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Time Steps</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg">
<meta name="theme-color" content="#0f766e">
<style>
:root{box-sizing:border-box;--bg:#f6f7f5;--card:#fff;--tx:#14201e;--mut:#66726f;--ac:#0f766e;--ac2:#ccefe9;--bd:#e1e5e3;--warn:#c2410c;--bad:#fde1d6;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1514;--card:#16201f;--tx:#e8f0ee;--mut:#8da09c;--ac:#2dd4bf;--ac2:#134e48;--bd:#25322f;--warn:#fb923c;--bad:#4a2415}}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,sans-serif;max-width:480px;margin:auto;padding:12px 14px 80px}
h1{font-size:20px;margin:6px 0 12px}.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
.mut{color:var(--mut);font-size:13px}label.mut{display:block;margin-top:8px}.big{font-size:44px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}#go{width:100%;padding:18px;font-size:20px;font-weight:700;border:0;border-radius:14px;background:var(--ac);color:var(--bg);margin-top:10px}#go.stop{background:var(--warn);color:#fff}
.btn{padding:10px 16px;border:0;border-radius:10px;background:var(--ac);color:var(--bg);font-weight:700}.btn.alt{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.bar{height:12px;background:var(--ac2);border-radius:8px;overflow:hidden;margin:8px 0 4px}.bar i{display:block;height:100%;background:var(--ac);width:0}
.row{display:flex;gap:8px;align-items:center}.row>label{flex:1;font-size:13px;color:var(--mut)}input,select{width:100%;font:inherit;padding:8px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;max-width:480px;margin:auto;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;padding:14px;border:0;background:none;color:var(--mut);font-weight:600}nav button.on{color:var(--ac)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}.chip{flex:none;padding:7px 13px;border:1px solid var(--bd);border-radius:20px;background:var(--card)}.chip.on{background:var(--ac);color:var(--bg);border-color:var(--ac)}
.seg{display:flex;border:1px solid var(--bd);border-radius:12px;overflow:hidden;margin:8px 0}.seg button{flex:1;padding:8px;border:0;background:var(--card)}.seg button.on{background:var(--ac2);font-weight:700}.seg button.no{background:var(--bad);font-weight:700;color:var(--warn)}
.stats{display:flex;justify-content:space-around;text-align:center;margin-top:8px}.stats b{display:block;font-size:20px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:8px}.grid i{font-style:normal;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:10px;font-size:12px;background:var(--bg);color:var(--mut)}
.grid .dow{background:none;aspect-ratio:auto}.grid .part{background:var(--ac2);color:var(--tx)}.grid .ok{background:var(--ac);color:var(--bg);font-weight:700}.grid .bad{background:var(--bad);color:var(--warn);font-weight:700}.grid b{font-size:15px;line-height:1}.grid .now{outline:2px solid var(--tx)}
.calh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.calh button,.sm{border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:4px 14px;font-size:18px}.sm{font-size:12px;padding:3px 9px;float:right}
.mrow{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-top:1px solid var(--bd)}.mrow .seg{margin:0;width:110px}
.cnt{display:flex;align-items:center;justify-content:space-between;margin-top:8px}.cnt button{width:48px;height:48px;font-size:24px;border:1px solid var(--bd);border-radius:12px;background:var(--bg)}
svg text{fill:var(--mut);font-size:10px}rect.g.n{fill:var(--bd)}rect.g.ok,rect.g.part{fill:var(--ac)}rect.g.bad{fill:var(--warn)}.hide{display:none}
</style></head><body>
<section id="p1">
<h1>Time Steps</h1>
<div class="card"><div class="mut" style="text-align:center">Elapsed</div><div class="big" id="clock">00:00:00</div>
<div class="mut" style="text-align:center">≈ <b id="live" style="color:var(--tx)">0</b> steps</div>
<button id="go">Start Workout</button></div>
<div class="card"><b>Today</b><div class="bar"><i id="tb"></i></div><div class="mut" id="tt"></div></div>
<div class="card"><b>Settings</b><div class="row" style="margin-top:8px"><label>Steps per minute<input id="rate" type="number" min="1" inputmode="numeric"></label><label>Daily goal<input id="goal" type="number" min="1" inputmode="numeric"></label></div>
<p class="mut">Steps are added automatically when you press Stop: minutes walked × steps per minute. No manual entry. Everything stays on this device.</p></div>
</section>
<section id="p2" class="hide"><h1>Daily Track</h1><div id="tk"></div></section>
<section id="p3" class="hide">
<h1>Progress</h1>
<div class="chips" id="tchips"></div>
<div class="chips" id="chips"></div>
<div class="row hide" id="cust"><label>From<input id="from" type="date"></label><label>To<input id="to" type="date"></label></div>
<div class="seg" id="seg"></div>
<div class="card" id="out"></div>
</section>
<nav><button id="n1" class="on">Timer</button><button id="n2">Track</button><button id="n3">Progress</button></nav>
<script>
const K='vsc1',DEF=()=>[{id:'diet',name:'Diet / eating control',type:'meals',items:['Breakfast','Lunch','Snacks','Dinner']},{id:'sugar',name:'No sugar',type:'check'},{id:'water',name:'Water (glasses)',type:'count',target:8}];
let S={sessions:[],rate:100,goal:10000,start:null,tr:DEF(),log:{}};
try{Object.assign(S,JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){}
if(!S.tr)S.tr=DEF();if(!S.log)S.log={};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s),fmt=n=>Math.round(n).toLocaleString(),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const D=(y,m,d)=>new Date(y,m,d),day0=(t=Date.now())=>{const x=new Date(t);return D(x.getFullYear(),x.getMonth(),x.getDate())};
const addD=(d,n)=>D(d.getFullYear(),d.getMonth(),d.getDate()+n);
const sum=(a,b)=>S.sessions.reduce((t,x)=>x.s>=+a&&x.s<+b?t+x.n:t,0);
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
let filt='day',view='ring',tid='steps',td=day0(),edit=null,calM=D(day0().getFullYear(),day0().getMonth(),1);
const FL=[['day','Daily'],['week','Weekly'],['month','Monthly'],['year','Annually'],['all','All time'],['custom','Custom']],VL=[['ring','Progress'],['bars','Graph'],['cal','Calendar'],['grass','Grass']];
/* score 0..1 for a tracker on a day, or null if nothing logged */
function sc(id,d){if(id=='steps'){const s=sum(d,addD(d,1));return s>0?s/S.goal:null}
const t=S.tr.find(x=>x.id==id),v=(S.log[iso(d)]||{})[id];if(!t||v==null)return null;
if(t.type=='check')return v==1?1:0;
if(t.type=='count')return v>0?Math.min(1,v/t.target):null;
const m=Object.values(v);return m.length?m.filter(x=>x==1).length/t.items.length:null}
function agg(id,a,b){let l=0,t=0,p=0;for(let d=a;d<b;d=addD(d,1)){const s=sc(id,d);if(s!=null){l++;t+=Math.min(1,s);if(s>=1)p++}}return{l,avg:l?t/l:0,p}}
function range(){const t=day0(),y=t.getFullYear(),m=t.getMonth();
if(filt=='day')return[t,addD(t,1)];
if(filt=='week'){const a=addD(t,-((t.getDay()+6)%7));return[a,addD(a,7)]}
if(filt=='month')return[D(y,m,1),D(y,m+1,1)];
if(filt=='year')return[D(y,0,1),D(y+1,0,1)];
if(filt=='all'){let f=t;for(const x of S.sessions)if(day0(x.s)<f)f=day0(x.s);for(const k in S.log){const d=new Date(k+'T00:00');if(d<f)f=d}return[f,addD(t,1)]}
const a=new Date($('#from').value+'T00:00'),b=new Date($('#to').value+'T00:00');
return(isNaN(a)||isNaN(b)||b<a)?[t,addD(t,1)]:[a,addD(b,1)]}
function buckets(a,b,m){const n=Math.round((b-a)/864e5),o=[];
if(m=='day'){for(let h=0;h<24;h++)o.push([new Date(+a+h*36e5),new Date(+a+(h+1)*36e5),h])}
else if(m=='year'||n>62){for(let d=D(a.getFullYear(),a.getMonth(),1);d<b;d=D(d.getFullYear(),d.getMonth()+1,1))o.push([d,D(d.getFullYear(),d.getMonth()+1,1),d.toLocaleString([],{month:'short'})])}
else for(let d=a;d<b;d=addD(d,1))o.push([d,addD(d,1),m=='week'?d.toLocaleString([],{weekday:'short'}):d.getDate()]);
return o}
function bars(a,b){const st=tid=='steps',m=(!st&&filt=='day')?'week':filt,a2=m!=filt?addD(a,-6):a;
const bs=buckets(a2,b,m).map(([s,e,l])=>{const lo=s<a2?a2:s,hi=e>b?b:e;return st?{v:sum(lo,hi),l,g:m!='day'&&e-s<=9e7}:{v:agg(tid,lo,hi).avg*100,l,g:0}});
const hasG=st&&bs.some(x=>x.g),mx=st?Math.max(1,...bs.map(x=>x.v),hasG?S.goal:0):100,n=bs.length,W=340,H=170,bw=W/n,sp=Math.ceil(n/12);
let s=`<svg viewBox="0 0 ${W} ${H+18}" width="100%">`;
bs.forEach((x,i)=>{const h=x.v/mx*H,full=st?x.g&&x.v>=S.goal:x.v>=99.5;s+=`<rect x="${i*bw+bw*.15}" y="${H-h}" width="${bw*.7}" height="${h}" rx="3" fill="var(--ac)" opacity="${full?1:.6}"/>`;if(i%sp==0)s+=`<text x="${i*bw+bw/2}" y="${H+13}" text-anchor="middle">${x.l}</text>`});
if(hasG){const y=H-S.goal/mx*H;s+=`<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="var(--warn)" stroke-dasharray="4 3"/><text x="2" y="${y-3}">goal</text>`}
return s+'</svg>'+(st?'':`<p class="mut">Bars show the average score % (100% = perfect)${m!=filt?' for the last 7 days':''}.</p>`)}
function cellOf(d){const s=sc(tid,d);return s==null?['','']:s>=1?['ok','<b>✓</b>']:s<=0?['bad','<b>✗</b>']:['part','']}
function cal(){const y=calM.getFullYear(),m=calM.getMonth(),f=(D(y,m,1).getDay()+6)%7,dim=D(y,m+1,0).getDate(),t=day0();
let h=`<div class="calh"><button data-a="pm">‹</button><b>${calM.toLocaleString([],{month:'long',year:'numeric'})}</b><button data-a="nm">›</button></div><div class="grid">`+'MTWTFSS'.split('').map(c=>`<i class="dow">${c}</i>`).join('')+'<i style="background:none"></i>'.repeat(f);
for(let d=1;d<=dim;d++){const dt=D(y,m,d),[c,mk]=cellOf(dt);h+=`<i class="${c}${+dt==+t?' now':''}">${mk}${d}</i>`}
let k=0,c=t;if(!((sc(tid,c)||0)>=1))c=addD(t,-1);
while((sc(tid,c)||0)>=1){k++;c=addD(c,-1)}
return h+`</div><p class="mut">✓ goal met · ✗ cheated/missed · shaded = partly done. Current streak: <b style="color:var(--tx)">${k} day${k==1?'':'s'}</b></p>`}
function grass(){const t=day0(),W=26,st=addD(addD(t,-((t.getDay()+6)%7)),-(W-1)*7);
let s=`<svg viewBox="0 0 ${W*13} 91" width="100%">`;
for(let w=0;w<W;w++)for(let r=0;r<7;r++){const d=addD(st,w*7+r);if(d>t)continue;const x=sc(tid,d),c=x==null?'n':x>=1?'ok':x<=0?'bad':'part';s+=`<rect class="g ${c}" x="${w*13}" y="${r*13}" width="11" height="11" rx="2"${c=='part'?` style="fill-opacity:${.25+.6*x}"`:''}><title>${iso(d)}</title></rect>`}
return s+'</svg><p class="mut">Last 26 weeks (rows Mon–Sun, newest on the right). Green = goal met, light green = partly, orange = cheated/missed, grey = nothing logged.</p>'}
function insight(a,b){const t=S.tr.find(x=>x.id==tid);if(!t)return'';let o='';
const wd=Array.from({length:7},()=>[0,0]);
for(let d=a;d<b;d=addD(d,1)){const s=sc(tid,d);if(s!=null){const i=(d.getDay()+6)%7;wd[i][0]+=Math.min(1,s);wd[i][1]++}}
let w=-1,wv=2;wd.forEach((x,i)=>{if(x[1]&&x[0]/x[1]<wv){wv=x[0]/x[1];w=i}});
if(filt!='day'&&w>=0&&wv<1)o+=`<p>📉 Weakest weekday: <b>${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][w]}</b> (${Math.round(wv*100)}% average)</p>`;
if(t.type=='meals'){const c=t.items.map(()=>0);for(let d=a;d<b;d=addD(d,1)){const v=(S.log[iso(d)]||{})[tid]||{};t.items.forEach((_,i)=>{if(v[i]==-1)c[i]++})}const m=Math.max(...c);if(m>0)o+=`<p>🍪 Cheated most at: <b>${esc(t.items[c.indexOf(m)])}</b> (${m}×)</p>`}
return o}
function render(){
$('#tchips').innerHTML=[{id:'steps',name:'Steps'},...S.tr].map(t=>`<button class="chip${t.id==tid?' on':''}" data-k="${t.id}">${esc(t.name)}</button>`).join('');
$('#chips').innerHTML=FL.map(([k,l])=>`<button class="chip${k==filt?' on':''}" data-f="${k}">${l}</button>`).join('');
$('#seg').innerHTML=VL.map(([k,l])=>`<button class="${k==view?'on':''}" data-v="${k}">${l}</button>`).join('');
$('#cust').classList.toggle('hide',filt!='custom');
const[a,b]=range(),days=Math.max(1,Math.round((b-a)/864e5)),st=tid=='steps';
let p,big,sub,h;
if(st){const tot=sum(a,b),t1=addD(day0(),1),eff=Math.max(1,Math.round(((b<t1?b:t1)-a)/864e5)),tgt=S.goal*days;p=Math.min(1,tot/tgt);big=Math.round(tot/tgt*100)+'%';
sub=`<b>${fmt(tot)} / ${fmt(tgt)}</b> steps<br><span class="mut">Target = ${fmt(S.goal)} × ${days} day${days>1?'s':''}</span>`;
h=`<div class="stats"><div><b>${fmt(tot)}</b><span class="mut">total</span></div><div><b>${fmt(tot/eff)}</b><span class="mut">avg / day</span></div></div>`}
else{const g=agg(tid,a,b);p=g.avg;big=Math.round(g.avg*100)+'%';
sub=`<b>${g.l}</b> of ${days} day${days>1?'s':''} logged<br><span class="mut">Average score of logged days</span>`;
h=`<div class="stats"><div><b>${g.p}</b><span class="mut">perfect days</span></div><div><b>${g.l-g.p}</b><span class="mut">slipped days</span></div></div>`+insight(a,b)}
if(view=='ring'){const C=2*Math.PI*52;h=`<svg viewBox="0 0 130 130" width="190" style="display:block;margin:auto"><circle cx="65" cy="65" r="52" fill="none" stroke="var(--ac2)" stroke-width="12"/><circle cx="65" cy="65" r="52" fill="none" stroke="var(--ac)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C*p} ${C}" transform="rotate(-90 65 65)"/><text x="65" y="68" text-anchor="middle" style="font-size:24px;font-weight:700;fill:var(--tx)">${big}</text></svg><div class="bar"><i style="width:${p*100}%"></i></div><p style="text-align:center;margin:4px 0">${sub}</p>`+h}
else if(view=='bars')h=bars(a,b)+h;else if(view=='cal')h=cal()+h;else h=grass()+h;
$('#out').innerHTML=h}
$('#tchips').onclick=e=>{const k=e.target.dataset.k;if(k){tid=k;render()}};
$('#chips').onclick=e=>{const f=e.target.dataset.f;if(f){filt=f;render()}};
$('#seg').onclick=e=>{const v=e.target.dataset.v;if(v){view=v;render()}};
$('#out').onclick=e=>{const a=e.target.dataset.a;if(a){calM=D(calM.getFullYear(),calM.getMonth()+(a=='nm'?1:-1),1);render()}};
$('#from').onchange=$('#to').onchange=render;
$('#from').value=iso(D(day0().getFullYear(),day0().getMonth(),1));$('#to').value=iso(day0());
/* Track tab */
function renderTrack(){const k=iso(td),L=S.log[k]||{},isT=+td==+day0();
let h=`<div class="calh"><button data-a="tp">‹</button><b>${isT?'Today':td.toLocaleDateString([],{weekday:'short',day:'numeric',month:'short'})}</b><button data-a="tn">›</button></div>`;
S.tr.forEach(t=>{const v=L[t.id],s=sc(t.id,td);
h+=`<div class="card"><button class="sm" data-a="edit" data-id="${t.id}">Edit</button><b>${esc(t.name)}</b>${s!=null?` <span class="mut">${Math.round(s*100)}%</span>`:''}`;
if(t.type=='check')h+=`<div class="seg"><button class="${v==1?'on':''}" data-t="${t.id}" data-v="1">✓ Done</button><button class="${v==-1?'no':''}" data-t="${t.id}" data-v="-1">✗ Missed</button></div>`;
else if(t.type=='count')h+=`<div class="cnt"><button data-t="${t.id}" data-d="-1">−</button><span><b style="font-size:26px">${v||0}</b> / ${t.target}</span><button data-t="${t.id}" data-d="1">+</button></div><div class="bar"><i style="width:${Math.min(100,(v||0)/t.target*100)}%"></i></div>`;
else{h+='<div style="margin-top:6px">';t.items.forEach((it,i)=>{const x=(v||{})[i];h+=`<div class="mrow"><span>${esc(it)}</span><div class="seg"><button class="${x==1?'on':''}" data-t="${t.id}" data-i="${i}" data-v="1">✓</button><button class="${x==-1?'no':''}" data-t="${t.id}" data-i="${i}" data-v="-1">✗</button></div></div>`});h+='<div class="mut">✓ followed · ✗ cheated. Unmarked parts count as not followed.</div></div>'}
h+='</div>'});
h+=edit?form():'<button class="btn" data-a="add" style="width:100%">+ Add tracker</button>';
$('#tk').innerHTML=h}
function form(){const t=edit.id?S.tr.find(x=>x.id==edit.id):{},ty=t.type||'check';
return `<div class="card"><b>${edit.id?'Edit tracker':'New tracker'}</b>
<label class="mut">Name<input id="fn" value="${esc(t.name||'')}" placeholder="e.g. No sugar, Gym, Reading"></label>
<label class="mut">Type<select id="ft"><option value="check"${ty=='check'?' selected':''}>Tick / cross (yes or no)</option><option value="count"${ty=='count'?' selected':''}>Counter (water, glasses…)</option><option value="meals"${ty=='meals'?' selected':''}>Several parts of a day (meals)</option></select></label>
<label class="mut">Counter: daily target<input id="fg" type="number" min="1" value="${t.target||8}"></label>
<label class="mut">Parts: comma separated<input id="fi" value="${esc((t.items||['Breakfast','Lunch','Snacks','Dinner']).join(', '))}"></label>
<div class="row" style="margin-top:12px"><button class="btn" data-a="save">Save</button><button class="btn alt" data-a="cancel">Cancel</button>${edit.id?'<button class="btn alt" data-a="del" style="margin-left:auto;color:var(--warn)">Delete</button>':''}</div></div>`}
function saveT(){const name=$('#fn').value.trim();if(!name){$('#fn').focus();return false}
const type=$('#ft').value,o={id:edit.id||'t'+Date.now(),name,type};
if(type=='count')o.target=Math.max(1,+$('#fg').value||8);
if(type=='meals'){o.items=$('#fi').value.split(',').map(x=>x.trim()).filter(Boolean);if(!o.items.length)o.items=['Meal']}
if(edit.id){const i=S.tr.findIndex(x=>x.id==edit.id);if(S.tr[i].type!=type)for(const d in S.log)delete S.log[d][o.id];S.tr[i]=o}else S.tr.push(o);
save();edit=null;return true}
function setVal(d){const k=iso(td),L=S.log[k]=S.log[k]||{},t=S.tr.find(x=>x.id==d.t);
if(t.type=='check'){if(L[t.id]==+d.v)delete L[t.id];else L[t.id]=+d.v}
else if(t.type=='count')L[t.id]=Math.max(0,(L[t.id]||0)+ +d.d);
else{const o=L[t.id]=L[t.id]||{};if(o[d.i]==+d.v)delete o[d.i];else o[d.i]=+d.v;if(!Object.keys(o).length)delete L[t.id]}
save()}
$('#tk').onclick=e=>{const el=e.target.closest('button');if(!el)return;const d=el.dataset;
if(d.a=='tp')td=addD(td,-1);else if(d.a=='tn'){if(td<day0())td=addD(td,1)}
else if(d.a=='add')edit={id:null};else if(d.a=='edit')edit={id:d.id};else if(d.a=='cancel')edit=null;
else if(d.a=='save'){if(!saveT())return}
else if(d.a=='del'){if(!edit.confirm){edit.confirm=1;el.textContent='Tap again to delete';return}
S.tr=S.tr.filter(x=>x.id!=edit.id);for(const k in S.log)delete S.log[k][edit.id];if(tid==edit.id)tid='steps';save();edit=null}
else if(d.t)setVal(d);else return;
renderTrack()};
/* Timer tab */
function tick(){const run=S.start!=null,el=run?Date.now()-S.start:0,s=Math.floor(el/1e3);
$('#go').textContent=run?'Stop Workout':'Start Workout';$('#go').className=run?'stop':'';
$('#clock').textContent=[s/3600|0,(s/60|0)%60,s%60].map(x=>String(x).padStart(2,'0')).join(':');
$('#live').textContent=fmt(Math.floor(el/6e4*S.rate));
const t=sum(day0(),addD(day0(),1));$('#tb').style.width=Math.min(100,t/S.goal*100)+'%';$('#tt').textContent=fmt(t)+' / '+fmt(S.goal)+' steps ('+Math.round(t/S.goal*100)+'%)'}
$('#go').onclick=()=>{if(S.start==null)S.start=Date.now();else{const e=Date.now(),n=Math.floor((e-S.start)/6e4*S.rate);if(n>0)S.sessions.push({s:S.start,e,n});S.start=null}save();tick()};
$('#rate').value=S.rate;$('#goal').value=S.goal;
$('#rate').onchange=()=>{S.rate=Math.max(1,+$('#rate').value||100);$('#rate').value=S.rate;save();tick()};
$('#goal').onchange=()=>{S.goal=Math.max(1,+$('#goal').value||10000);$('#goal').value=S.goal;save();tick()};
function tab(n){for(let i=1;i<4;i++){$('#p'+i).classList.toggle('hide',i!=n);$('#n'+i).classList.toggle('on',i==n)}if(n==2)renderTrack();if(n==3)render()}
[1,2,3].forEach(i=>$('#n'+i).onclick=()=>tab(i));
setInterval(tick,1e3);document.addEventListener('visibilitychange',tick);tick();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
